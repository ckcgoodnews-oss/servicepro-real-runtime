services:
  app:
    build: .
    container_name: servicepro-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      APP_NAME: ServicePro
      APP_VERSION: 8.0.0-alpha.1
      DATA_STORE: postgres
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      PORTAL_TOKEN_SECRET: ${PORTAL_TOKEN_SECRET:?PORTAL_TOKEN_SECRET is required}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - servicepro_uploads:/app/uploads

  postgres:
    image: postgres:16-alpine
    container_name: servicepro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: servicepro
      POSTGRES_USER: servicepro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - servicepro_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: servicepro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - servicepro_redis:/data

volumes:
  servicepro_pgdata:
  servicepro_redis:
  servicepro_uploads:
