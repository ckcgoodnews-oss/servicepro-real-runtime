<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#77704b"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Truck/trash icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Truck bed (open top) -->
    <path d="M-80,40 L-80,-30 L40,-30 L40,40 Z" fill="white"/>
    <path d="M-75,-25 L-75,35 L35,35 L35,-25 Z" fill="rgba(0,0,0,0.15)"/>
    <!-- Truck cab -->
    <path d="M40,-5 L40,40 L80,40 L80,5 L60,-5 Z" fill="white"/>
    <rect x="55" y="10" width="18" height="12" rx="3" fill="rgba(0,0,0,0.2)"/>
    <!-- Wheels -->
    <circle cx="-50" cy="50" r="14" fill="white"/>
    <circle cx="-50" cy="50" r="6" fill="rgba(0,0,0,0.3)"/>
    <circle cx="55" cy="50" r="14" fill="white"/>
    <circle cx="55" cy="50" r="6" fill="rgba(0,0,0,0.3)"/>
    <!-- Junk items sticking out -->
    <rect x="-60" y="-55" width="15" height="30" rx="2" fill="white" opacity="0.7" transform="rotate(-10 -52 -40)"/>
    <rect x="-30" y="-50" width="12" height="25" rx="2" fill="white" opacity="0.7"/>
    <circle cx="10" cy="-40" r="12" fill="white" opacity="0.7"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Junk Removal</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>