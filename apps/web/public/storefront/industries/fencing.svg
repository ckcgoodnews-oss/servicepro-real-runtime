<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#7f674c"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Fence icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Fence posts -->
    <polygon points="-70,-80 -60,-70 -50,-80 -50,80 -70,80"/>
    <polygon points="-25,-80 -15,-70 -5,-80 -5,80 -25,80"/>
    <polygon points="20,-80 30,-70 40,-80 40,80 20,80"/>
    <polygon points="65,-80 75,-70 85,-80 85,80 65,80"/>
    <!-- Horizontal rails -->
    <rect x="-75" y="-20" width="165" height="14" rx="2" opacity="0.8"/>
    <rect x="-75" y="30" width="165" height="14" rx="2" opacity="0.8"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Fencing</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>