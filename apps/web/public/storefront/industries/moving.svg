<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#4f72a3"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Truck/box icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Truck body -->
    <rect x="-80" y="-40" width="100" height="80" rx="5"/>
    <!-- Truck cab -->
    <path d="M20,-10 L20,40 L70,40 L70,0 L45,-10 Z" fill="white"/>
    <rect x="45" y="5" width="20" height="15" rx="3" fill="rgba(0,0,0,0.2)"/>
    <!-- Wheels -->
    <circle cx="-50" cy="50" r="15" fill="white"/>
    <circle cx="-50" cy="50" r="7" fill="rgba(0,0,0,0.3)"/>
    <circle cx="45" cy="50" r="15" fill="white"/>
    <circle cx="45" cy="50" r="7" fill="rgba(0,0,0,0.3)"/>
    <!-- Box on truck -->
    <rect x="-55" y="-65" width="40" height="30" rx="3" fill="white" opacity="0.7"/>
    <line x1="-55" y1="-50" x2="-15" y2="-50" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
    <line x1="-35" y1="-65" x2="-35" y2="-35" stroke="rgba(0,0,0,0.2)" stroke-width="2"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Moving</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>