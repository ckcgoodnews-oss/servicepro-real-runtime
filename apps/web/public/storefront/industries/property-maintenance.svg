<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#56705f"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Building/wrench icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Building -->
    <rect x="-55" y="-70" width="75" height="140" rx="4"/>
    <rect x="-45" y="-55" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-20" y="-55" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-45" y="-30" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-20" y="-30" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-45" y="-5" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-20" y="-5" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-45" y="20" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <rect x="-20" y="20" width="15" height="15" fill="rgba(0,0,0,0.2)"/>
    <!-- Wrench -->
    <rect x="35" y="-30" width="12" height="80" rx="4" transform="rotate(20 41 10)"/>
    <circle cx="55" cy="-35" r="18" fill="white"/>
    <circle cx="55" cy="-35" r="8" fill="rgba(0,0,0,0.15)"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Property Maintenance</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>