<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#637389"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Clipboard/house icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Clipboard -->
    <rect x="-45" y="-70" width="90" height="140" rx="8"/>
    <rect x="-20" y="-80" width="40" height="20" rx="6" fill="white"/>
    <rect x="-20" y="-80" width="40" height="20" rx="6" fill="rgba(0,0,0,0.1)"/>
    <!-- House icon on clipboard -->
    <polygon points="0,-30 -25,-10 -20,-10 -20,20 20,20 20,-10 25,-10" fill="rgba(0,0,0,0.2)"/>
    <!-- Checkmarks -->
    <path d="M-30,35 L-25,40 L-15,30" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-5" y="32" width="35" height="6" rx="3" fill="rgba(0,0,0,0.15)"/>
    <path d="M-30,52 L-25,57 L-15,47" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-5" y="49" width="35" height="6" rx="3" fill="rgba(0,0,0,0.15)"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Home Inspection</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>