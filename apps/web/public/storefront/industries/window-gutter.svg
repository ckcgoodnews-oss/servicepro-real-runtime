<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <rect width="1200" height="600" fill="#38859a"/>
  <rect width="1200" height="600" fill="rgba(0,0,0,0.15)"/>
  <!-- Window/squeegee icon -->
  <g transform="translate(600,250)" fill="white" opacity="0.9">
    <!-- Window frame -->
    <rect x="-55" y="-65" width="110" height="110" rx="5" fill="none" stroke="white" stroke-width="8"/>
    <line x1="0" y1="-65" x2="0" y2="45" stroke="white" stroke-width="6"/>
    <line x1="-55" y1="-10" x2="55" y2="-10" stroke="white" stroke-width="6"/>
    <!-- Squeegee -->
    <rect x="25" y="50" width="50" height="8" rx="4"/>
    <rect x="47" y="55" width="8" height="40" rx="3"/>
  </g>
  <text x="600" y="450" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="36" font-weight="700">Window &amp; Gutter</text>
  <text x="600" y="490" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="system-ui, sans-serif" font-size="18">Professional Service Solutions</text>
</svg>