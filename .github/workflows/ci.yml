name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  api:
    name: API — Load, Test, Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate migration ordering
        run: npm run migrations:check
      - name: Verify API loads
        run: node -e "require('./apps/api/src/router'); console.log('Router OK')"
      - name: Run tests
        run: npm test
      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high --omit=dev

  web:
    name: Web — TypeScript, Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_BASE_URL: https://servicepro-api.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/web && npm ci
      - name: Root release build
        run: npm run build
      - name: Verify monorepo web build
        run: npm run web:build
      - name: Verify Cloudflare Pages export
        run: npm run web:build:pages
