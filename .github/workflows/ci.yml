name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

jobs:
  test:
    name: Node runtime tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Validate API entry point
        run: node --check apps/api/src/server.js

      - name: Check migration ordering
        run: npm run migrations:check

      - name: Run production-critical tests
        run: npm run test:core
        env:
          DATA_STORE: json
          DATA_FILE: ./data/ci-runtime.json
          JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
          PORTAL_TOKEN_SECRET: ci-portal-secret-ci-portal-secret-ci-portal

      - name: Run full runtime test suite
        run: npm test
        env:
          DATA_STORE: json
          DATA_FILE: ./data/ci-runtime-full.json
          JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
          PORTAL_TOKEN_SECRET: ci-portal-secret-ci-portal-secret-ci-portal

      - name: Type-check frontend
        run: npm run typecheck

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Run root production build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.aardvark-enterprises.net

      - name: Build Cloudflare Pages export
        run: npm run web:build:pages
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.aardvark-enterprises.net

