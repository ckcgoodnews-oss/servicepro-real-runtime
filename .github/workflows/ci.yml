name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API — Load, Test, Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify API loads
        run: node -e "require('./apps/api/src/router'); console.log('Router OK')"
      - name: Run tests
        run: npm test
      - name: Security audit (high/critical only)
        run: npm audit --audit-level=high --omit=dev

  web:
    name: Web — TypeScript, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cd apps/web && npm ci
      - name: TypeScript check
        run: cd apps/web && npx tsc --noEmit
      - name: Production build
        run: cd apps/web && npm run build
