name: Production CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop, codex/production-hardening]

permissions:
  contents: read

concurrency:
  group: production-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATA_STORE: json
  JWT_SECRET: ci-test-secret-ci-test-secret-ci-test-secret
  PORTAL_TOKEN_SECRET: ci-portal-secret-ci-portal-secret-ci-portal

jobs:
  repository:
    name: Repository, migrations, and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run scripts:check
      - run: npm run migrations:check
      - name: Validate production API JavaScript
        shell: bash
        run: |
          node --check apps/api/src/server.js
          node --check apps/api/src/router.js
          node --check apps/api/src/routes/payments.js
          node --check apps/api/src/routes/auth.js
          node --check apps/api/src/routes/trial.js
          node --check apps/api/src/services/paymentService.js
          node --check apps/api/src/services/notificationService.js
          node --check apps/api/src/repositories/paymentRepository.js

  tests:
    name: Core and complete regression suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Core production tests
        run: npm run test:core
        env:
          DATA_FILE: ./data/ci-runtime-core.json
      - name: Complete regression suite
        run: npm test
        env:
          DATA_FILE: ./data/ci-runtime-full.json

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run audit:production

  web:
    name: TypeScript and production builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm --prefix apps/web ci
      - run: npm run typecheck
      - name: Build Next.js standalone output
        run: npm --prefix apps/web run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.aardvark-enterprises.net
      - name: Build Cloudflare static export
        run: npm --prefix apps/web run build:pages
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_BASE_URL: https://api.aardvark-enterprises.net
