services:
  - type: web
    name: servicepro-api-alpha-ckcgoodnews
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --omit=dev
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 8.0.0-alpha.1
      - key: DEFAULT_TENANT_ID
        value: tenant_demo
      - key: DATA_STORE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: servicepro-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PORTAL_TOKEN_SECRET
        generateValue: true

  - type: web
    name: servicepro-web-alpha-ckcgoodnews
    runtime: node
    plan: starter
    rootDir: apps/web
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

databases:
  - name: servicepro-postgres
    plan: basic-256mb
    region: ohio
    postgresMajorVersion: "16"
    databaseName: servicepro
    user: servicepro
    ipAllowList: []
